if(k==='requestcancel'){let b=D.bookings.find(b=>b.id==id);return this.ask('Ajukan pembatalan?',this.field('rqreason','Alasan')+'<p>Pemilik atau Manajer akan meninjau pembatalan dan refund.</p>',()=>{b.request={reason:document.getElementById('f-rqreason').value||'Diajukan kasir',at:'5 Nov 10.20'};b.log.push({at:'5 Nov 10.20',t:'Pembatalan diajukan'});this.toast('Pembatalan diajukan ke Pemilik dan Manajer')},false,'Ajukan')}
if(k==='invite'){let extra=D.team.filter(m=>m.role!=='pemilik'&&m.status!=='nonaktif').length;if(extra>=this.teamLimit())return this.ask('Batas akun tim tercapai',`<p>Paket ${this.plan} mendapat ${this.teamLimit()} akun tambahan. ${this.k(19)}</p>`,()=>this.go('paket'),false,'Lihat paket');return this.ask('Undang anggota tim',this.field('mname','Nama')+this.field('memail','Email','','email')+this.field('mrole','Peran','kasir','text',[['kasir','Kasir'],['manajer','Manajer']]),()=>{let name=document.getElementById('f-mname').value.trim(),email=document.getElementById('f-memail').value.trim();if(!name||!/.+@.+\..+/.test(email)){this.toast('Nama dan email yang valid wajib diisi');return false}D.team.push({id:Date.now(),name,email,role:document.getElementById('f-mrole').value,status:'diundang',last:'—'});D.activity.unshift({id:Date.now(),at:'5 Nov 10.20',who:this.actor(),text:'Mengundang '+name});this.toast('Undangan dikirim ke '+email+' (simulasi)')},false,'Kirim undangan')}
if(k==='memberrole'){let m=D.team.find(m=>m.id==id);return this.ask('Ubah peran '+m.name,this.field('nrole','Peran',m.role,'text',[['kasir','Kasir'],['manajer','Manajer']]),()=>{m.role=document.getElementById('f-nrole').value;D.activity.unshift({id:Date.now(),at:'5 Nov 10.20',who:this.actor(),text:'Peran '+m.name+' diubah'});this.toast('Peran diperbarui')})}
if(k==='memberoff'){let m=D.team.find(m=>m.id==id);m.status=m.status==='nonaktif'?'aktif':'nonaktif';return this.toast(m.name+(m.status==='nonaktif'?' tidak bisa login lagi':' bisa login kembali'))}
if(k==='resendinvite')return this.toast('Undangan dikirim ulang (simulasi)');
if(k==='integ'){if(id==='api'&&this.rank()<3)return this.ask('API dan webhook di paket Pro','<p>Tingkatkan ke Pro untuk menghubungkan sistem lain.</p>',()=>this.go('paket'),false,'Lihat paket');let body={wa:this.field('wanum','Nomor WhatsApp Business',D.biz.wa),gcal:'<p>Anda akan diarahkan ke Google untuk memberi izin (simulasi).</p>',ga:this.field('gaid','Google Analytics ID',D.integ.ga.id||'G-')+this.field('pixel','Meta Pixel ID',D.integ.ga.pixel),api:this.field('hook','URL webhook','https://')}[id];return this.ask('Hubungkan',body,()=>{let I=D.integ;if(id==='wa')Object.assign(I.wa,{on:true,number:document.getElementById('f-wanum').value});if(id==='gcal')I.gcal.on=true;if(id==='ga')Object.assign(I.ga,{on:true,id:document.getElementById('f-gaid').value,pixel:document.getElementById('f-pixel').value});if(id==='api')Object.assign(I.api,{on:true,key:'bq_live_••••'+String(Date.now()).slice(-4),hook:document.getElementById('f-hook').value});this.toast('Terhubung (simulasi)')},false,'Hubungkan')}
if(k==='integoff'){D.integ[id].on=false;return this.toast('Koneksi diputus')}
if(k==='integtest')return this.toast('Pesan uji terkirim (simulasi)');
return this.track(()=>oldAct.call(this,k,id,el))};

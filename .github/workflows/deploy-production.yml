name: deploy-production

on:
  push:
    branches:
      - main

concurrency:
  group: bookqu-production
  cancel-in-progress: true

jobs:
  # Deploy only a commit whose SQLite, MySQL and quality jobs pass (ADR-0015, BQ-018).
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  deploy:
    name: Deploy BookQu production
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Validate build output
        run: |
          set -e
          test -d public/build
          test -n "$(find public/build -type f -print -quit)"
          test -f public/build/manifest.json
          find public/build/assets -maxdepth 1 -type f -name '*.css' -print -quit | grep -q .
          find public/build/assets -maxdepth 1 -type f -name '*.js' -print -quit | grep -q .
          find public/build -maxdepth 2 -type f -print | sort

      - name: Create Laravel source archive
        run: |
          set -e

          ARCHIVE_DIR="$RUNNER_TEMP/bookqu-deploy"
          mkdir -p "$ARCHIVE_DIR"

          tar -czf "$ARCHIVE_DIR/bookqu-laravel.tar.gz" \
            --exclude='./.git' \
            --exclude='./.env*' \
            --exclude='./node_modules' \
            --exclude='./vendor' \
            --exclude='./storage' \
            --exclude='./public/build' \
            -C . .

          echo "Laravel archive created:"
          ls -lh "$ARCHIVE_DIR/bookqu-laravel.tar.gz"

          tar -tzf "$ARCHIVE_DIR/bookqu-laravel.tar.gz" | head -40

      - name: Create frontend build archive
        run: |
          set -e

          ARCHIVE_DIR="$RUNNER_TEMP/bookqu-deploy"
          mkdir -p "$ARCHIVE_DIR"

          tar -czf "$ARCHIVE_DIR/bookqu-build.tar.gz" \
            -C public build

          echo "Frontend archive created:"
          ls -lh "$ARCHIVE_DIR/bookqu-build.tar.gz"

          tar -tzf "$ARCHIVE_DIR/bookqu-build.tar.gz"

      - name: Prepare temporary deployment directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOSTDATA_HOST }}
          username: ${{ secrets.HOSTDATA_USER }}
          key: ${{ secrets.HOSTDATA_SSH_KEY }}
          port: ${{ secrets.HOSTDATA_PORT }}
          script: |
            set -eu
            DEPLOY_DIR="$HOME/bookqu-production-deploy"
            rm -rf "$DEPLOY_DIR"
            mkdir -p "$DEPLOY_DIR"
            echo "Temporary deployment directory prepared: $DEPLOY_DIR"

      - name: Transfer Laravel source archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTDATA_HOST }}
          username: ${{ secrets.HOSTDATA_USER }}
          key: ${{ secrets.HOSTDATA_SSH_KEY }}
          port: ${{ secrets.HOSTDATA_PORT }}
          source: ${{ runner.temp }}/bookqu-deploy/bookqu-laravel.tar.gz
          target: /home/bacadite/bookqu-production-deploy

      - name: Transfer frontend build archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTDATA_HOST }}
          username: ${{ secrets.HOSTDATA_USER }}
          key: ${{ secrets.HOSTDATA_SSH_KEY }}
          port: ${{ secrets.HOSTDATA_PORT }}
          source: ${{ runner.temp }}/bookqu-deploy/bookqu-build.tar.gz
          target: /home/bacadite/bookqu-production-deploy

      - name: Deploy and validate production
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOSTDATA_HOST }}
          username: ${{ secrets.HOSTDATA_USER }}
          key: ${{ secrets.HOSTDATA_SSH_KEY }}
          port: ${{ secrets.HOSTDATA_PORT }}
          script: |
            set -Eeuo pipefail

            DEPLOY_DIR="$HOME/bookqu-production-deploy"
            LARAVEL_DIR="$HOME/domains/bookqu.my.id/laravel"
            PUBLIC_DIR="$HOME/domains/bookqu.my.id/public_html"
            BACKUP_ROOT="$HOME/domains/bookqu.my.id/deploy-backups"
            DB_BACKUP_DIR="$HOME/domains/bookqu.my.id/db-backups"
            BACKUP_RETENTION_DAYS=14
            TIMESTAMP="$(date +%Y%m%d-%H%M%S)"
            BACKUP_DIR="$BACKUP_ROOT/$TIMESTAMP"
            SOURCE_DIR="$DEPLOY_DIR/laravel-source"
            BUILD_DIR="$DEPLOY_DIR/public-assets"
            DEPLOY_STARTED=0
            MAINTENANCE_ON=0
            DB_CNF=""

            echo "=== PRODUCTION DEPLOY DIAGNOSTIC ==="
            echo "DEPLOY_DIR=$DEPLOY_DIR"
            echo "LARAVEL_DIR=$LARAVEL_DIR"
            echo "PUBLIC_DIR=$PUBLIC_DIR"

            echo "--- Deployment directory ---"
            ls -lah "$DEPLOY_DIR" || true
            echo "--- Transferred archives ---"
            find "$DEPLOY_DIR" -type f \( -name 'bookqu-laravel.tar.gz' -o -name 'bookqu-build.tar.gz' \) -print || true

            echo "--- Laravel directory ---"
            ls -lah "$LARAVEL_DIR" || true

            echo "--- Laravel required files ---"
            for file in \
              "$LARAVEL_DIR/.env" \
              "$LARAVEL_DIR/vendor/autoload.php" \
              "$LARAVEL_DIR/artisan" \
              "$LARAVEL_DIR/composer.json" \
              "$LARAVEL_DIR/composer.lock"
            do
              if [ -f "$file" ]; then
                echo "OK: $file"
              else
                echo "MISSING: $file"
              fi
            done

            echo "--- Public directory ---"
            ls -lah "$PUBLIC_DIR" || true

            echo "--- Environment keys ---"
            grep -E '^[[:space:]]*DB_(CONNECTION|DATABASE|USERNAME)=' "$LARAVEL_DIR/.env" \
              | sed 's/=.*/=<present>/'

            echo "=== END DIAGNOSTIC ==="

            rollback() {
              status=$?
              if [ -n "$DB_CNF" ]; then
                rm -f "$DB_CNF"
              fi
              if [ "$status" -eq 0 ] || [ "$DEPLOY_STARTED" -ne 1 ]; then
                exit "$status"
              fi

              echo "Deployment failed. Restoring Laravel source and public build from $BACKUP_DIR"
              for item in app bootstrap config database resources routes; do
                rm -rf "$LARAVEL_DIR/$item"
                cp -a "$BACKUP_DIR/$item" "$LARAVEL_DIR/$item"
              done
              for item in composer.json composer.lock; do
                cp -a "$BACKUP_DIR/$item" "$LARAVEL_DIR/$item"
              done
              rm -rf "$PUBLIC_DIR/build"
              if [ -d "$BACKUP_DIR/public-build" ]; then
                cp -a "$BACKUP_DIR/public-build" "$PUBLIC_DIR/build"
              fi
              cd "$LARAVEL_DIR"
              php artisan optimize:clear || true
              php artisan optimize || true
              if [ "$MAINTENANCE_ON" -eq 1 ]; then
                php artisan up || true
              fi
              echo "PRODUCTION DEPLOY FAILED; code rollback attempted. Code backup: $BACKUP_DIR"
              echo "The schema may already be migrated. Database backup: ${DB_BACKUP_FILE:-none}; restore per docs/operations.md section 6."
              exit "$status"
            }
            trap rollback EXIT

            LARAVEL_ARCHIVE="$(find "$DEPLOY_DIR" -type f -name 'bookqu-laravel.tar.gz' -print -quit)"
            BUILD_ARCHIVE="$(find "$DEPLOY_DIR" -type f -name 'bookqu-build.tar.gz' -print -quit)"
            test -n "$LARAVEL_ARCHIVE"
            test -n "$BUILD_ARCHIVE"
            test -d "$LARAVEL_DIR"
            test -f "$LARAVEL_DIR/.env"
            test -f "$LARAVEL_DIR/vendor/autoload.php"
            grep -Eq '^[[:space:]]*DB_CONNECTION=' "$LARAVEL_DIR/.env"
            grep -Eq '^[[:space:]]*DB_DATABASE=' "$LARAVEL_DIR/.env"
            grep -Eq '^[[:space:]]*DB_USERNAME=' "$LARAVEL_DIR/.env"
            test -d "$PUBLIC_DIR"

            rm -rf "$SOURCE_DIR" "$BUILD_DIR"
            mkdir -p "$SOURCE_DIR" "$BUILD_DIR"
            tar -xzf "$LARAVEL_ARCHIVE" -C "$SOURCE_DIR"
            tar -xzf "$BUILD_ARCHIVE" -C "$BUILD_DIR"
            test -f "$SOURCE_DIR/artisan"
            test -f "$SOURCE_DIR/composer.json"
            test -f "$SOURCE_DIR/composer.lock"
            test -f "$BUILD_DIR/build/manifest.json"
            find "$BUILD_DIR/build/assets" -maxdepth 1 -type f -name '*.css' -print -quit | grep -q .
            find "$BUILD_DIR/build/assets" -maxdepth 1 -type f -name '*.js' -print -quit | grep -q .

            mkdir -p "$BACKUP_DIR"
            for item in app bootstrap config database resources routes; do
              cp -a "$LARAVEL_DIR/$item" "$BACKUP_DIR/$item"
            done
            cp -a "$LARAVEL_DIR/composer.json" "$BACKUP_DIR/composer.json"
            cp -a "$LARAVEL_DIR/composer.lock" "$BACKUP_DIR/composer.lock"
            if [ -d "$PUBLIC_DIR/build" ]; then
              cp -a "$PUBLIC_DIR/build" "$BACKUP_DIR/public-build"
            fi
            chmod 700 "$BACKUP_DIR"
            echo "Backup created: $BACKUP_DIR"

            # Database backup before anything changes. No backup, no deploy (ADR-0015).
            # Credentials come from the live Laravel config and go into a 600 client
            # file, never onto the command line or into the log.
            mkdir -p "$DB_BACKUP_DIR"
            chmod 700 "$DB_BACKUP_DIR"
            command -v mysqldump >/dev/null
            DB_CNF="$(umask 077; mktemp "$DB_BACKUP_DIR/.client-XXXXXX.cnf")"
            DB_NAME="$(cd "$LARAVEL_DIR" && php -r '
              require "vendor/autoload.php";
              $app = require "bootstrap/app.php";
              $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              $db = config("database.connections.".config("database.default"));
              $quote = fn ($value) => "\"".addcslashes((string) $value, "\\\"")."\"";
              file_put_contents($argv[1], implode(PHP_EOL, [
                "[client]",
                "user=".$quote($db["username"]),
                "password=".$quote($db["password"]),
                "host=".$quote($db["host"]),
                "port=".$quote($db["port"]),
                "",
              ]));
              echo $db["database"];
            ' "$DB_CNF")"
            test -n "$DB_NAME"
            DB_BACKUP_FILE="$DB_BACKUP_DIR/bookqu-$TIMESTAMP.sql.gz"
            (umask 077; mysqldump --defaults-extra-file="$DB_CNF" --single-transaction --quick --routines --triggers --no-tablespaces "$DB_NAME" | gzip > "$DB_BACKUP_FILE")
            rm -f "$DB_CNF"
            DB_CNF=""
            gzip -t "$DB_BACKUP_FILE"
            zcat "$DB_BACKUP_FILE" | tail -n 1 | grep -q 'Dump completed'
            chmod 600 "$DB_BACKUP_FILE"
            echo "Database backup created: $DB_BACKUP_FILE ($(du -h "$DB_BACKUP_FILE" | cut -f1))"

            find "$DB_BACKUP_DIR" -maxdepth 1 -name 'bookqu-*.sql.gz' -mtime +"$BACKUP_RETENTION_DAYS" -delete
            find "$BACKUP_ROOT" -mindepth 1 -maxdepth 1 -type d -mtime +"$BACKUP_RETENTION_DAYS" -exec rm -rf {} +

            DEPLOY_STARTED=1
            for item in app bootstrap config database resources routes; do
              rm -rf "$LARAVEL_DIR/$item"
              cp -a "$SOURCE_DIR/$item" "$LARAVEL_DIR/$item"
            done
            cp -a "$SOURCE_DIR/composer.json" "$LARAVEL_DIR/composer.json"
            cp -a "$SOURCE_DIR/composer.lock" "$LARAVEL_DIR/composer.lock"

            find "$SOURCE_DIR/public" -mindepth 1 -maxdepth 1 \
              ! -name index.php ! -name .htaccess ! -name .user.ini ! -name build \
              -exec cp -a {} "$PUBLIC_DIR/" \;
            rm -rf "$PUBLIC_DIR/build"
            cp -a "$BUILD_DIR/build" "$PUBLIC_DIR/build"

            # Laravel Vite assets
            rm -rf "$LARAVEL_DIR/public/build"
            cp -a "$BUILD_DIR/build" "$LARAVEL_DIR/public/build"

            cd "$LARAVEL_DIR"
            # HostData disables proc_open, which Laravel's Composer package:discover
            # script invokes through Illuminate\Process. Install dependencies and
            # generate the optimized autoloader without Composer lifecycle scripts;
            # the Laravel cache commands below remain the deployment validation.
            composer install --no-dev --no-scripts --optimize-autoloader
            php artisan down --retry=60
            MAINTENANCE_ON=1
            php artisan migrate --force
            php artisan optimize:clear
            php artisan optimize
            php artisan up
            MAINTENANCE_ON=0

            php artisan --version
            php artisan route:list >/dev/null
            php artisan route:cache
            test -f "$PUBLIC_DIR/build/manifest.json"
            test -f "$LARAVEL_DIR/public/build/manifest.json"
            find "$PUBLIC_DIR/build/assets" -maxdepth 1 -type f -name '*.css' -print -quit | grep -q .
            find "$PUBLIC_DIR/build/assets" -maxdepth 1 -type f -name '*.js' -print -quit | grep -q .
            find "$LARAVEL_DIR/public/build/assets" -maxdepth 1 -type f -name '*.css' -print -quit | grep -q .
            find "$LARAVEL_DIR/public/build/assets" -maxdepth 1 -type f -name '*.js' -print -quit | grep -q .
            test -f "$LARAVEL_DIR/.env"
            php -r "require 'vendor/autoload.php'; echo 'Composer autoload OK';"

            echo "--- DEPLOYED COMMIT / ROUTE DIAGNOSTIC ---"

            cd "$LARAVEL_DIR"

            echo "--- web.php custom-domain routing ---"
            grep -n -A8 -B3 "Custom domain routing" routes/web.php || true

            echo "--- root route declarations ---"
            grep -n "Route::get('/'" routes/web.php || true

            echo "--- customer booking route helper ---"
            grep -n "function route\|function isCustomDomain\|function buildParameters" app/Support/CustomerBookingRoutes.php || true

            echo "--- cached routes ---"
            php artisan route:list --name=customer.booking

            echo "--- HTTP health check ---"
            curl -i --max-time 20 https://bookqu.my.id/ || true

            HTTP_STATUS="$(curl -fsS --max-time 20 -o /dev/null -w '%{http_code}' https://bookqu.my.id)"
            case "$HTTP_STATUS" in
              2*|3*) echo "HTTP health check passed: $HTTP_STATUS" ;;
              *) echo "HTTP health check failed: $HTTP_STATUS"; exit 1 ;;
            esac

            echo "--- LATEST LARAVEL ERROR LOG ---"
            tail -n 100 "$LARAVEL_DIR/storage/logs/laravel.log" || true

            echo "================================="
            echo "PRODUCTION DEPLOY PASSED"
            echo "================================="

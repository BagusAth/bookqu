name: Test HostData SSH

on:
  workflow_dispatch:

jobs:
  test-ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Probe SingaPay webhook route (BQ-076, temporary)
        run: |
          curl -s -i -X POST -H "Content-Type: application/json" -H "Accept: application/json" \
            -d '{"probe":"bq-076"}' https://bookqu.my.id/api/webhooks/singapay/transaction -o response.txt || true
          echo "--- status line and selected headers ---"
          grep -iE "^HTTP/|^server:|^x-powered-by:|^cf-ray:|^x-litespeed|^content-type:|^x-imunify" response.txt || true
          echo "--- first 200 characters of the body ---"
          sed '1,/^\r\?$/d' response.txt | head -c 200; echo

      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOSTDATA_HOST }}
          username: ${{ secrets.HOSTDATA_USER }}
          key: ${{ secrets.HOSTDATA_SSH_KEY }}
          port: ${{ secrets.HOSTDATA_PORT }}
          script: |
            echo "SSH connection successful"
            whoami
            hostname
            pwd
            echo "--- Deploy prerequisites (BQ-018) ---"
            php --version | head -n 1
            command -v mysqldump && mysqldump --version || echo "MISSING: mysqldump (the gated deploy will refuse to migrate)"
            command -v gzip zcat
            echo "--- Database engine (BQ-073) ---"
            cd ~/domains/bookqu.my.id/laravel && php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo "Database server version: ", Illuminate\Support\Facades\DB::scalar("select version()"), PHP_EOL;' || echo "Could not read the database version"

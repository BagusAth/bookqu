name: Test HostData SSH

on:
  workflow_dispatch:

jobs:
  test-ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOSTDATA_HOST }}
          username: ${{ secrets.HOSTDATA_USER }}
          key: ${{ secrets.HOSTDATA_SSH_KEY }}
          port: ${{ secrets.HOSTDATA_PORT }}
          script: |
            echo "SSH connection successful"
            whoami
            hostname
            pwd
            echo "--- Deploy prerequisites (BQ-018) ---"
            php --version | head -n 1
            command -v mysqldump && mysqldump --version || echo "MISSING: mysqldump (the gated deploy will refuse to migrate)"
            command -v gzip zcat